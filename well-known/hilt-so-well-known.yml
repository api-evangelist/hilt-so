source: 'live GET probes of /.well-known/* on every Hilt host (2026-09-19): hilt.so, www.hilt.so, docs.hilt.so,
  api.hilt.so (OpenAPI servers[] + MCP + A2A host), app.hilt.so, pay.hilt.so'
summary: 'Real documents are served on api.hilt.so: an RFC 8414 authorization-server document (issuer https://api.hilt.so,
  PKCE S256, dynamic client registration at /oauth/register, scopes pay_me:read/request/prepare), an RFC 9728 protected-resource
  document at the RESOURCE path /.well-known/oauth-protected-resource/mcp/pay-me (named by the 401 WWW-Authenticate
  resource_metadata of the PayMe MCP endpoint), and an A2A agent card at both /.well-known/agent-card.json and the
  legacy /.well-known/agent.json. www.hilt.so, app.hilt.so and pay.hilt.so each serve a /.well-known/agent.json
  that is a Hilt-schema discovery manifest (schema_version hilt-agent-discovery-*), NOT an A2A AgentCard; recorded
  as served JSON but not graded as a card. www.hilt.so also serves /.well-known/llms.txt and /.well-known/llms-full.txt.
  No host serves security.txt, openid-configuration, api-catalog or ai-plugin.json.'
pointer_basis: 'WellKnown pointer emitted on the strength of the api.hilt.so 200s (RFC 8414 + RFC 9728 + agent card).
  SecurityTxt pointer NOT emitted: RFC 9116 is unimplemented on every host (www/app answer 404, api answers JSON
  404, docs answers an SPA shell).'
false_positive_watch: docs.hilt.so (Mintlify) answers HTTP 200 text/html (684 KB SPA shell) for EVERY /.well-known/*
  path and for /openapi.json, /llms.txt excepted. Those 200s are recorded as misses. The real OpenAPI lives on api.hilt.so
  and www.hilt.so.
