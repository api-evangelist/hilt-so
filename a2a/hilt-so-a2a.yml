agent_card:
  name: Hilt Pay Agent Gateway
  description: 'Agent-readable access to Hilt Pay: x402 V2 paid requests with Solana USDC settlement, atomic metered
    usage, durable entitlements, receipts, signed webhooks, subscription state, sandbox bootstrap, and live API-plan
    activation.'
  url: https://api.hilt.so/a2a/jsonrpc
  version: 1.1.0
  protocol_version: 0.3.0
  preferred_transport: JSONRPC
  additional_interfaces:
  - url: https://api.hilt.so/a2a/jsonrpc
    transport: JSONRPC
  provider:
    organization: Hilt
    url: https://www.hilt.so
  documentation_url: https://docs.hilt.so
  capabilities:
    streaming: false
    pushNotifications: false
    stateTransitionHistory: false
  security_schemes: {}
  security: []
  default_input_modes:
  - text
  default_output_modes:
  - text
  skills:
  - id: discover_hilt_catalog
    name: Discover Hilt Pay
    description: Return canonical products, pricing, interfaces, and buying paths.
    tags:
    - payments
    - x402
    - solana
    - usdc
    - catalog
    examples:
    - Show me the Hilt Pay catalog
    - '{"action":"pricing","input":{}}'
  - id: bootstrap_hilt_sandbox
    name: Bootstrap Hilt Sandbox
    description: Create a free sandbox setup intent and scoped sandbox key.
    tags:
    - sandbox
    - bootstrap
    - api-key
    examples:
    - '{"action":"bootstrap","input":{"agent_name":"My Agent"}}'
  - id: activate_hilt_api_plan
    name: Activate Hilt Pay API
    description: Discover Starter, Growth, and Scale x402 V2 activation tools paid in Solana USDC with automatic
      entitlement and key delivery.
    tags:
    - payments
    - entitlements
    - receipts
    - api
    examples:
    - '{"action":"activate_plan","input":{}}'
  - id: build_metered_hilt_endpoint
    name: Build a metered Hilt endpoint
    description: Implement consume, HTTP 402 PAYMENT-REQUIRED, paid retry settlement, atomic consumption, and serve
      using the Hilt Pay API V2 contract.
    tags:
    - x402 V2
    - metered usage
    - PAYMENT-SIGNATURE
    - Solana USDC
    examples:
    - How should my agent API settle and consume one paid request?
grade:
  against: A2A 1.0.0
  result: conformant
  hard_checks:
    capabilities_is_object: true
    protocolVersion_present: true
    skills_is_array: true
  optional_checks:
    preferredTransport_present: true
    defaultInputModes_present: true
    defaultOutputModes_present: true
    provider_present: true
    documentationUrl_present: true
  deviations:
  - 'protocolVersion is "0.3.0", not "1.0.0": the card targets the 0.3 line of the spec and additionally serves
    the pre-0.3 /.well-known/agent.json path.'
  - 'securitySchemes is an empty object and security is an empty array: the card advertises anonymous access; paid
    skills are gated at the tool/route level by x402 V2 (HTTP 402 PAYMENT-REQUIRED) rather than by an A2A security
    scheme, which a client cannot learn from the card alone.'
  - capabilities.streaming, pushNotifications and stateTransitionHistory are all false; supportsAuthenticatedExtendedCard
    is absent and the JSON-RPC endpoint returns -32004 for agent/getAuthenticatedExtendedCard.
  - The Agentverse transport at https://api.hilt.so/agentverse/a2a (named in Hilt's own discovery manifest and llms.txt)
    is not declared in additionalInterfaces.
  - Skill examples mix natural language with a Hilt-specific JSON action envelope ({"action":"bootstrap","input":{...}})
    that the A2A spec does not define.
