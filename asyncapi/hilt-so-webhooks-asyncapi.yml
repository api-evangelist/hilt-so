  schemas:
    WebhookHeaders:
      type: object
      properties:
        X-Hilt-Signature:
          type: string
          description: t=<unix_timestamp>,v1=<hex_hmac_sha256>; HMAC-SHA256 over "<timestamp>.<raw_json_body>" with
            the endpoint signing secret. Verify with a timing-safe compare against the RAW body.
          examples:
          - t=1714830131,v1=5f1d...
      required:
      - X-Hilt-Signature
    WebhookEnvelope:
      type: object
      required:
      - id
      - type
      - api_version
      - created_at
      - livemode
      - data
      properties:
        id:
          type: string
          format: uuid
          description: Deduplicate by this id, not by payload order.
        type:
          type: string
          enum:
          - payment.confirmed
          - payment.failed
          - receipt.created
          - membership.activated
          - membership.renewed
          - membership.entered_grace
          - membership.expired
          - membership.reapproval_required
          - delivery.failed
          - support.ticket.created
        api_version:
          type: string
          description: Date-stamped webhook schema version (example 2026-05-04).
        created_at:
          type: string
          format: date-time
        livemode:
          type: boolean
        data:
          type: object
          description: Event-specific object. Payment-linked events include payment.id, payment.product.id, membership.id
            and receipt.id when applicable (see the provider example).
          additionalProperties: true
  securitySchemes:
    hiltSignature:
      type: symmetricEncryption
      description: HMAC-SHA256 signature in X-Hilt-Signature using the per-endpoint signing secret returned when
        the endpoint is created.
x-testing:
  send_test_event: POST /v1/webhooks/endpoints/{endpoint_id}/test with event_type (operationId test_webhook_endpoint_v1_webhooks_endpoints__endpoint_id__test_post);
    CLI hilt webhooks test ENDPOINT_ID --event payment.confirmed
  deliveries: GET /v1/webhooks/deliveries (status filter dead_letter), GET /v1/webhooks/timeline?payment_id=
  sdk: '@hiltpay/sdk src/webhooks.ts and hilt_sdk/webhooks.py verify + route helpers'
x-access-events:
  note: Hilt Pay API (/v1/access) subscribes webhooks via POST /v1/access/webhooks with subscribed_events such as
    access.entitlement.activated and payment.confirmed (SDK README example); the access.* event family is referenced
    in the SDK but not enumerated on the docs page, so it is not listed as a channel here.
