asyncapi: 3.0.0
info:
  title: Hilt Webhooks
  version: '2026-05-04'
  description: 'Hilt webhook events delivered by HTTPS POST to merchant endpoints. GENERATED by API Evangelist (method:
    generated) from the provider''s documented webhook catalogue at https://docs.hilt.so/developers/webhooks, the
    signature and retry rules on that page, and the two example payloads Hilt publishes in github.com/Hiltpay/hilt-developer-assets/examples/webhooks.
    Hilt publishes no AsyncAPI of its own; nothing here is invented beyond that documentation.'
  contact:
    name: Hilt
    url: https://www.hilt.so
    email: support@hilt.so
  x-generated: '2026-09-19'
  x-method: generated
  x-source: https://docs.hilt.so/developers/webhooks
externalDocs:
  url: https://docs.hilt.so/developers/webhooks
servers:
  merchant-endpoint:
    host: '{merchant-host}'
    protocol: https
    description: 'The merchant-registered endpoint (POST /v1/webhooks/endpoints, operationId create_webhook_endpoint_v1_webhooks_endpoints_post,
      or POST /v1/access/webhooks). Hilt POSTs each event; only a 2xx counts as delivered. Retry schedule: immediate,
      30 s, 2 min, 10 min, 30 min, 2 h; then dead_letter (replayable via replay_owned_webhook_delivery_v1_webhooks_deliveries__delivery_id__replay_post).'
    variables:
      merchant-host:
        description: merchant-controlled host
channels:
  payment_confirmed:
    address: payment.confirmed
    description: The payment is final in Hilt and it is safe to unlock access
    messages:
      payment_confirmed:
        $ref: '#/components/messages/payment_confirmed'
  payment_failed:
    address: payment.failed
    description: The payment did not complete successfully
    messages:
