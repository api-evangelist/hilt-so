description: 'Entity graph of the Hilt API. The spec is request/response-shaped (289 schemas, mostly *Request/*Response),
  so entities are inferred from the resource paths and the id-reference fields those schemas carry. No id prefixes:
  Hilt ids are UUIDs (example payload: payment f0f4e620-..., membership 0ce94832-..., receipt 51b69947-...); public
  ids for PayMe objects are `public_id` slugs; API keys are prefixed hk_live_/hk_sandbox_.'
