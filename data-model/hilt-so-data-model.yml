entities:
- name: Account
  domain: account
  description: Merchant/dashboard account; owns API keys, products, webhooks, billing.
- name: ApiKey
  domain: api-keys
  id_format: uuid (key value hk_live_/hk_sandbox_)
  description: X-Hilt-Key credential with access:* permissions.
- name: Product
  domain: products
  description: Workspace sellable (slug, hosted checkout /p/{slug}); has memberships, payments, analytics, handoff
    links.
- name: Payment
  domain: checkout
  description: A buyer payment (status, amount_minor_units, token_mint, tx_signature, delivery_status); belongs
    to a Product.
- name: Membership
  domain: memberships
  description: Access record created by a payment (status, platform, current_period_end_at); renewal, grace, reactivation,
    delivery diagnostics.
- name: Receipt
  domain: Receipt
  description: Proof object with verify URL, PDF, invoice metadata; schema_version hilt-v1.
- name: SupportTicket
  domain: Support
  description: Support thread inside the payment trail.
- name: WebhookEndpoint
  domain: webhooks
  description: Merchant endpoint with signing secret; has deliveries and events.
- name: WebhookEvent
  domain: webhooks
  description: Emitted event (id, type, api_version, livemode, data).
- name: WebhookDelivery
  domain: webhooks
  description: One attempt to deliver an event; replayable.
- name: AccessApp
  domain: hilt-pay-api
  description: Hilt Pay API application container for products, sessions, webhooks.
- name: AccessProduct
  domain: hilt-pay-api
  description: Pay API product (external_product_id, default_rail, billing_model, renewal_mode).
- name: PaymentSession
  domain: hilt-pay-api
  description: x402 / hosted session bound to a pending entitlement (checkout_url, amount, asset).
- name: Entitlement
  domain: hilt-pay-api
  description: Durable or metered access grant; check (has_access) vs consume (atomic units).
- name: MeteredSession
  domain: hilt-pay-api
  description: 'MPP channel session: escrow deposit, cumulative vouchers, deliveries, commits, settle.'
- name: NativeSubscriptionAuthorization
  domain: hilt-pay-api
  description: Buyer-approved recurring Solana USDC authorization; cancel-intent/cancel-confirm.
- name: AgentSetupIntent
  domain: hilt-pay-api
  description: Agent bootstrap intent -> manifest -> owner approval -> live keys.
- name: PayMeProfile
  domain: pay-me
  description: OAuth-verified X handle bound to a signature-verified receiving wallet; wallet links, authenticator
    enrollments.
- name: PayMePaymentRequest
  domain: Hilt PayMe Connector
  description: Connector-started payment awaiting wallet approval.
- name: PayMeAgentPayment
  domain: pay-me
  description: MPP HTTP 402 payment to a verified handle (POST /v1/pay-me/payments).
- name: Rail
  domain: hilt-pay-api
  description: Settlement rail (solana_usdc, solana_sol) and per-merchant rail settings.
