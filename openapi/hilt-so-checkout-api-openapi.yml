                $ref: '#/components/schemas/AutomaticRenewSetupResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pay/identity/start:
    post:
      tags:
      - Checkout
      summary: Start Checkout Identity Handshake
      operationId: start_checkout_identity_handshake_v1_pay_identity_start_post
      requestBody:
