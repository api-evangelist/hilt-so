          - type: string
          - type: 'null'
          title: Automatic Renew Native Subscription Authority Pda
        automatic_renew_native_subscription_pda:
          anyOf:
          - type: string
          - type: 'null'
          title: Automatic Renew Native Subscription Pda
        automatic_renew_native_plan_pda:
          anyOf:
          - type: string
          - type: 'null'
          title: Automatic Renew Native Plan Pda
        automatic_renew_native_payer_token_account:
          anyOf:
          - type: string
          - type: 'null'
          title: Automatic Renew Native Payer Token Account
