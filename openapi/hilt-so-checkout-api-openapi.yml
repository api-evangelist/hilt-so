    PhantomRenewalMessageCallbackRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
        automatic_renew_setup_key:
          type: string
          title: Automatic Renew Setup Key
        nonce:
          type: string
          title: Nonce
        data:
          type: string
          title: Data
      type: object
      required:
      - payment_id
      - automatic_renew_setup_key
      - nonce
      - data
      title: PhantomRenewalMessageCallbackRequest
    IdentityHandshakeStartRequest:
      properties:
        slug:
          type: string
          title: Slug
        wallet_address:
          type: string
          title: Wallet Address
        wallet_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet Source
        customer_reference_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Reference Type
        customer_reference_value:
          type: string
          title: Customer Reference Value
        customer_reference_display:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Reference Display
      type: object
      required:
      - slug
      - wallet_address
      - customer_reference_value
      title: IdentityHandshakeStartRequest
    AutomaticRenewSetupRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
      type: object
      required:
      - payment_id
      title: AutomaticRenewSetupRequest
    PhantomMessageUrlRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
        identity_session_id:
          type: string
          title: Identity Session Id
        handoff_token:
