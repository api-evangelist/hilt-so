          application/json:
            schema:
              $ref: '#/components/schemas/IdentityHandshakeStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityHandshakeStartResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pay/identity/complete:
    post:
      tags:
      - Checkout
      summary: Complete Checkout Identity Handshake
      operationId: complete_checkout_identity_handshake_v1_pay_identity_complete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityHandshakeCompleteRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityHandshakeCompleteResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pay/phantom/connect/callback:
    post:
      tags:
      - Checkout
      summary: Phantom Connect Callback
      operationId: phantom_connect_callback_v1_pay_phantom_connect_callback_post
      requestBody:
