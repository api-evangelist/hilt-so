      required:
      - tx_signature
      - payer_wallet
      title: ConfirmRequest
    IdentityHandshakeStartResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        status:
          type: string
          title: Status
        wallet_address:
          type: string
          title: Wallet Address
        wallet_source:
          type: string
          title: Wallet Source
        identity_type:
          type: string
          title: Identity Type
        identity_value:
          type: string
          title: Identity Value
        identity_display:
          anyOf:
          - type: string
          - type: 'null'
          title: Identity Display
        challenge_message:
