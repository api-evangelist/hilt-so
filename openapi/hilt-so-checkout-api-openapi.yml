components:
  schemas:
    PhantomMessageCallbackResponse:
      properties:
        payment_id:
          type: string
          title: Payment Id
        identity_session_id:
          type: string
          title: Identity Session Id
        wallet_address:
          type: string
          title: Wallet Address
        verified_at:
          type: string
          title: Verified At
      type: object
      required:
      - payment_id
      - identity_session_id
      - wallet_address
      - verified_at
      title: PhantomMessageCallbackResponse
    BroadcastResponse:
      properties:
        payment_id:
          type: string
          title: Payment Id
        status:
          type: string
          title: Status
        tx_signature:
          type: string
          title: Tx Signature
      type: object
      required:
      - payment_id
      - status
      - tx_signature
      title: BroadcastResponse
    AutomaticRenewSetupResponse:
      properties:
        setup_key:
          type: string
          title: Setup Key
        instructions:
          items:
            type: object
          type: array
          title: Instructions
        mandate_message:
          type: string
          title: Mandate Message
        renewal_terms:
          type: object
          title: Renewal Terms
        native_subscription:
          anyOf:
          - type: object
          - type: 'null'
          title: Native Subscription
      type: object
      required:
      - setup_key
      - instructions
      - mandate_message
      - renewal_terms
      title: AutomaticRenewSetupResponse
    PhantomTransactionUrlRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
        serialized_transaction_b58:
          type: string
          title: Serialized Transaction B58
        handoff_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Handoff Token
      type: object
      required:
      - payment_id
      - serialized_transaction_b58
      title: PhantomTransactionUrlRequest
    PhantomTransactionCallbackRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
        nonce:
          type: string
          title: Nonce
        data:
          type: string
          title: Data
      type: object
      required:
      - payment_id
      - nonce
      - data
      title: PhantomTransactionCallbackRequest
    PhantomMessageCallbackRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
        identity_session_id:
          type: string
          title: Identity Session Id
        nonce:
          type: string
          title: Nonce
        data:
          type: string
          title: Data
      type: object
      required:
      - payment_id
      - identity_session_id
      - nonce
      - data
      title: PhantomMessageCallbackRequest
    PhantomConnectCallbackResponse:
      properties:
        payment_id:
          type: string
          title: Payment Id
        wallet_address:
          type: string
          title: Wallet Address
        wallet_source:
          type: string
          title: Wallet Source
        session_stored:
          type: boolean
          title: Session Stored
      type: object
      required:
      - payment_id
      - wallet_address
      - wallet_source
      - session_stored
      title: PhantomConnectCallbackResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    PhantomConnectCallbackRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
        phantom_encryption_public_key:
          type: string
          title: Phantom Encryption Public Key
        nonce:
          type: string
          title: Nonce
        data:
          type: string
          title: Data
      type: object
      required:
      - payment_id
      - phantom_encryption_public_key
      - nonce
      - data
      title: PhantomConnectCallbackRequest
    IdentityHandshakeCompleteResponse:
      properties:
        session_id:
          type: string
          title: Session Id
        status:
          type: string
          title: Status
        wallet_address:
          type: string
          title: Wallet Address
        wallet_source:
          type: string
          title: Wallet Source
        identity_type:
          type: string
          title: Identity Type
        identity_value:
          type: string
          title: Identity Value
        identity_display:
          anyOf:
          - type: string
          - type: 'null'
          title: Identity Display
        verified_at:
          type: string
          title: Verified At
        expires_at:
          type: string
          title: Expires At
      type: object
      required:
      - session_id
      - status
      - wallet_address
      - wallet_source
      - identity_type
      - identity_value
      - verified_at
      - expires_at
      title: IdentityHandshakeCompleteResponse
    ConfirmResponse:
      properties:
        status:
          type: string
          title: Status
        payment_id:
          type: string
          title: Payment Id
        delivery_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Type
        delivery_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Value
        amount_minor_units:
          type: integer
          title: Amount Minor Units
        delivery_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Status
        membership_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Membership Id
        membership_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Membership Status
        membership_period_end_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Membership Period End At
        automatic_renew_setup_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Automatic Renew Setup Status
        automatic_renew_setup_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Automatic Renew Setup Error
      type: object
      required:
      - status
      - payment_id
      - amount_minor_units
      title: ConfirmResponse
    PhantomRenewalMessageCallbackResponse:
      properties:
        payment_id:
          type: string
          title: Payment Id
        automatic_renew_setup_key:
          type: string
          title: Automatic Renew Setup Key
        wallet_address:
          type: string
          title: Wallet Address
        signed_message_b64:
          type: string
          title: Signed Message B64
      type: object
      required:
      - payment_id
      - automatic_renew_setup_key
      - wallet_address
      - signed_message_b64
      title: PhantomRenewalMessageCallbackResponse
    PhantomRenewalMessageUrlRequest:
      properties:
        payment_id:
          type: string
          title: Payment Id
        automatic_renew_setup_key:
          type: string
          title: Automatic Renew Setup Key
        handoff_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Handoff Token
      type: object
      required:
      - payment_id
      - automatic_renew_setup_key
      title: PhantomRenewalMessageUrlRequest
    ConfirmRequest:
      properties:
        slug:
          anyOf:
          - type: string
          - type: 'null'
          title: Slug
        product_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Product Id
        tx_signature:
          type: string
          title: Tx Signature
        payer_wallet:
          type: string
          title: Payer Wallet
        wallet_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet Source
        identity_session_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Identity Session Id
        customer_reference_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Reference Type
        customer_reference_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Reference Value
        customer_reference_display:
          anyOf:
          - type: string
          - type: 'null'
          title: Customer Reference Display
        payment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Id
        automatic_renew_setup_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Automatic Renew Setup Key
        automatic_renew_message_signature_b64:
