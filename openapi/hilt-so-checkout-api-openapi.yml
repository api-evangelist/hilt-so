      - wallet_source
      - identity_type
      - identity_value
      - challenge_message
      - expires_at
      title: IdentityHandshakeStartResponse
    PhantomTransactionCallbackResponse:
      properties:
        payment_id:
          type: string
          title: Payment Id
        wallet_address:
          type: string
          title: Wallet Address
        serialized_transaction_b64:
          type: string
          title: Serialized Transaction B64
      type: object
      required:
      - payment_id
      - wallet_address
      - serialized_transaction_b64
