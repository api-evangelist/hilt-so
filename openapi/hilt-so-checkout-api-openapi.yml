        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pay/phantom/message/callback:
    post:
      tags:
      - Checkout
      summary: Phantom Message Callback
