  /v1/agent-commerce/plans/starter/activate:
    post:
      operationId: activateHiltPayApiStarterWithX402
      summary: Activate Hilt Pay API Starter
      description: Pays 79 USDC through x402, activates 30 days of Hilt Pay API starter, writes the Hilt receipt and billing entitlement, and returns a live API key. Create a free Agent Bootstrap setup intent first.
      tags:
      - Hilt Pay API
      security: []
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '79'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                setup_intent_id:
                  type: string
                  format: uuid
                  description: Setup intent returned by the free Hilt Pay Agent Bootstrap endpoint.
                setup_token:
                  type: string
                  minLength: 20
                  description: Secret setup token returned by Agent Bootstrap.
                delivery_claim:
                  type: string
                  minLength: 32
                  maxLength: 512
                  description: Buyer-generated random secret used to recover the live API key if the paid response is interrupted.
              required:
              - setup_intent_id
              - setup_token
              - delivery_claim
              additionalProperties: false
            example:
              setup_intent_id: 00000000-0000-4000-8000-000000000000
              setup_token: hst_buyer_setup_token
              delivery_claim: buyer-generated-random-secret-at-least-32-characters
      responses:
        '200':
          description: Plan active and live API key delivered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '202':
          description: Payment settled and activation recovery is running
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '402':
          description: Payment Required
        '409':
          description: The setup or current billing state does not permit this activation
