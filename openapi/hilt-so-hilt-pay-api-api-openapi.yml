components:
  schemas:
    AccessProductCreateRequest:
      properties:
        access_app_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Access App Id
        external_product_id:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: External Product Id
        existing_product_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Existing Product Id
        title:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Description
        image_url:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Image Url
        amount_minor_units:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Amount Minor Units
        merchant_wallet:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Merchant Wallet
        billing_model:
          type: string
          title: Billing Model
          default: one_off
        renewal_mode:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Renewal Mode
        billing_interval_days:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Billing Interval Days
        entitlement_duration_days:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Entitlement Duration Days
          default: 30
        usage_unit:
          anyOf:
          - type: string
            maxLength: 80
            minLength: 1
          - type: 'null'
          title: Usage Unit
        usage_units_per_payment:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Usage Units Per Payment
        cancel_at_period_end:
          type: boolean
          title: Cancel At Period End
          default: true
        grace_period_days:
          type: integer
          minimum: 0
          title: Grace Period Days
          default: 0
        default_rail:
          type: string
          title: Default Rail
          description: Default hosted settlement rail. Public live values are solana_usdc and solana_sol.
          default: solana_usdc
          examples:
          - solana_usdc
          - solana_sol
        allowed_rails:
          items:
            type: string
          type: array
          title: Allowed Rails
          description: Hosted settlement rails allowed for this product. Use one asset per product.
          examples:
          - - solana_usdc
          - - solana_sol
        rail:
          anyOf:
          - type: string
          - type: 'null'
          title: Rail
          description: Optional alias for the product's default hosted settlement rail.
          examples:
          - solana_usdc
          - solana_sol
        status:
          type: string
          title: Status
          default: paused
        live_mode_confirmed:
          type: boolean
          title: Live Mode Confirmed
          default: false
        metadata:
          type: object
          title: Metadata
      type: object
      title: AccessProductCreateRequest
    AccessX402EntitlementResponse:
      properties:
        id:
          type: string
          title: Id
        access_app_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Access App Id
        access_product_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Product Id
        product_id:
          type: string
          title: Product Id
        external_customer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Customer Id
        wallet:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
        status:
          type: string
          title: Status
        active_from:
          anyOf:
          - type: string
          - type: 'null'
          title: Active From
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
        receipt_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Receipt Id
        payment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Id
        last_payment_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Payment Id
        rail_id:
          type: string
          title: Rail Id
        rail:
          type: object
          title: Rail
        livemode:
          type: boolean
          title: Livemode
        receipt:
          anyOf:
          - $ref: '#/components/schemas/AccessEntitlementReceiptReferenceResponse'
          - type: 'null'
        usage:
          anyOf:
          - $ref: '#/components/schemas/AccessEntitlementUsageResponse'
          - type: 'null'
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated At
      type: object
      required:
      - id
      - access_app_id
      - access_product_id
      - product_id
      - external_customer_id
      - wallet
      - email
      - status
      - active_from
      - expires_at
      - receipt_id
      - payment_id
      - last_payment_id
      - rail_id
      - rail
      - livemode
      - receipt
      - usage
      - source
      - created_at
      - updated_at
      title: AccessX402EntitlementResponse
    AccessRailsResponse:
      properties:
        default_rail:
          type: string
          title: Default Rail
        rails:
          items:
            $ref: '#/components/schemas/AccessRailCapability'
          type: array
          title: Rails
        caller:
          $ref: '#/components/schemas/AccessRailsCaller'
      additionalProperties: true
      type: object
      required:
      - default_rail
      - rails
      - caller
      title: AccessRailsResponse
    AccessWebhookCreateRequest:
      properties:
        label:
          type: string
          maxLength: 120
          minLength: 2
          title: Label
        url:
          type: string
          title: Url
        subscribed_events:
          items:
            type: string
          type: array
          title: Subscribed Events
        product_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Product Ids
        metadata:
          type: object
          title: Metadata
      type: object
      required:
      - label
      - url
      title: AccessWebhookCreateRequest
    AccessRailSettingUpdateRequest:
      properties:
        enabled:
          type: boolean
          title: Enabled
          default: false
        payout_address:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Payout Address
        label:
          anyOf:
          - type: string
            maxLength: 120
          - type: 'null'
          title: Label
        mode:
          type: string
          title: Mode
          default: live
        fee_collection_mode:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Fee Collection Mode
        fee_collection_status:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Fee Collection Status
        fee_collector_address:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Fee Collector Address
        fee_allowance_token_contract:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Fee Allowance Token Contract
        fee_allowance_limit_minor_units:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Fee Allowance Limit Minor Units
        fee_allowance_spent_minor_units:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Fee Allowance Spent Minor Units
        fee_allowance_expires_at:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Fee Allowance Expires At
        fee_allowance_tx_hash:
          anyOf:
          - type: string
            maxLength: 180
          - type: 'null'
          title: Fee Allowance Tx Hash
        fee_collection_metadata:
          type: object
          title: Fee Collection Metadata
        metadata:
          type: object
          title: Metadata
      type: object
      title: AccessRailSettingUpdateRequest
    AccessMeteredDeliveryResponse:
      properties:
        delivery:
          $ref: '#/components/schemas/AccessMeteredDelivery'
        units:
          type: integer
          title: Units
        unit_price_minor_units:
          type: integer
          title: Unit Price Minor Units
        commit_url:
          type: string
          title: Commit Url
        idempotent_replay:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Idempotent Replay
      additionalProperties: true
      type: object
      required:
      - delivery
      - units
      - unit_price_minor_units
      - commit_url
      title: AccessMeteredDeliveryResponse
    AccessEntitlementUsage:
      properties:
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        granted:
          type: integer
          title: Granted
        consumed:
          type: integer
          title: Consumed
        remaining:
