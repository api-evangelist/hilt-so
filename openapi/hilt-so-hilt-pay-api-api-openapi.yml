  /v1/agent-commerce/plans/claim:
    post:
      operationId: claimHiltPayApiMarketplaceKey
      summary: Claim a live Hilt Pay API key after marketplace activation
      description: Recovers live key delivery after a settled marketplace payment. Requires the purchase intent, Agent Bootstrap setup secret, and buyer-generated delivery claim.
      tags:
      - Hilt Pay API
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purchase_intent_id:
                  type: string
                  format: uuid
                setup_intent_id:
                  type: string
                  format: uuid
                setup_token:
                  type: string
                  minLength: 20
                delivery_claim:
                  type: string
                  minLength: 32
                  maxLength: 512
              required:
              - purchase_intent_id
              - setup_intent_id
              - setup_token
              - delivery_claim
              additionalProperties: false
      responses:
        '200':
          description: Live API key delivered
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '409':
          description: Activation is still being reconciled
