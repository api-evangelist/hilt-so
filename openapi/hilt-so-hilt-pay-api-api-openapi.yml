openapi: 3.2.0
info:
  title: Hilt Pay API
  description: Hilt Pay Workspace and Hilt Pay API routes for zero-custody Solana checkout, MPP metered payment channels, receipts, memberships, entitlements, native subscriptions, webhooks, and support context.
  version: 1.0.0
  contact:
    name: Hilt
    url: https://www.hilt.so
    email: hello@hilt.so
  x-guidance: Start with POST /v1/access/agent-bootstrap. An agent can purchase 30 days of Starter, Growth, or Scale through the matching x402 V2 activation endpoint paid in Solana USDC. For metered integrations, settle PAYMENT-SIGNATURE through POST /v1/access/x402/settle and atomically consume through POST /v1/access/entitlements/consume before serving. Never send private keys, seed phrases, or wallet secrets.
servers:
- url: https://api.hilt.so
tags:
- name: Hilt Pay API
paths:
  /v1/agent-commerce/offer:
    get:
      operationId: getHiltPayApiMarketplaceOffer
      summary: Get the Hilt Pay API marketplace catalog
      description: Returns the canonical Hilt Pay API plans, free Agent Bootstrap route, and live purchase paths.
      tags:
      - Hilt Pay API
      security: []
      responses:
        '200':
          description: Canonical Hilt Pay API marketplace offer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                service: Hilt Pay API
                suite: Hilt Pay
                agent: '@hiltcommerce'
                status: x402_enabled
                network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
                interfaces:
                  openapi: https://api.hilt.so/openapi.json
                  mcp: https://api.hilt.so/mcp
                  a2a: https://api.hilt.so/a2a/jsonrpc
                  agentCard: https://api.hilt.so/.well-known/agent-card.json
                x402Activation:
                  enabled: true
                  network: solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp
                  protectedResources:
                    starter: https://api.hilt.so/v1/agent-commerce/plans/starter/activate
                    growth: https://api.hilt.so/v1/agent-commerce/plans/growth/activate
                    scale: https://api.hilt.so/v1/agent-commerce/plans/scale/activate
                category: agent-commerce
                tags:
                - x402
                - Solana USDC
                - agent-commerce
                - checkout
                - receipts
                - entitlements
                - fulfillment
                positioning: 'Hilt Pay is payment-to-access infrastructure for stablecoin commerce: Solana USDC settlement, x402 protected-resource flows, receipts, entitlements, signed webhooks, subscription state, support context, and audit history.'
                paidRequestRuntime:
                  version: hilt-x402-v2-metered-2026-07-21
                  sequence:
                  - consume
                  - challenge
                  - pay
                  - settle
                  - consume
                  - serve
                  protocol: x402 V2 is the HTTP 402 protected-resource protocol shape.
                  settlementRail: Solana USDC
                  merchantServerRoutes:
                    createPaymentSession: POST https://api.hilt.so/v1/access/payment-sessions
                    settlePaymentSignature: POST https://api.hilt.so/v1/access/x402/settle
                    consumeMeteredUsage: POST https://api.hilt.so/v1/access/entitlements/consume
                    checkDurableAccess: POST https://api.hilt.so/v1/access/entitlements/check
                  authority: Atomic consumption decides whether each metered request is served. Entitlement checks remain the authority for durable or time-based access.
                  buyerBoundary: The buyer receives PAYMENT-REQUIRED and retries the protected resource with PAYMENT-SIGNATURE. The buyer never receives the merchant Hilt API key.
                  serveRule: Serve billable work only after settlement and atomic consumption succeed.
                  guide: https://docs.hilt.so/developers/agent-micropayments
                productStack:
                - id: hilt_pay_agent_bootstrap
                  name: Hilt Pay Agent Bootstrap
                  tier: sandbox
                  price:
                    amount: 0
                    currency: USD
                    display: Free
                    billing: free
                  buyerMode: agent_can_start_sandbox_owner_approves_live
                  endpoint: https://api.hilt.so/v1/access/agent-bootstrap
                  deliverable: Sandbox setup intent, scoped sandbox key, proposed app/product/protected-resource manifest, readiness blockers, and owner approval handoff.
                - id: hilt_pay_api
                  name: Hilt Pay API
                  tier: core_infrastructure
                  price:
                    display: Free sandbox; live from $79/month
                    billing: monthly_subscription
                  buyerMode: agent_bootstraps_pays_and_receives_live_access
                  pricingUrl: https://www.hilt.so/pricing?surface=api
                  plans:
                  - name: Sandbox
                    monthlyUsd: 0
                    liveSettlement: false
                    transactionFee: No live money
                  - name: Starter
                    monthlyUsd: 79
                    prepaidUsdc: 79
                    liveSettlement: true
                    transactionFee: 1.00%
                    endpoint: https://api.hilt.so/v1/agent-commerce/plans/starter/activate
                  - name: Growth
                    monthlyUsd: 349
                    prepaidUsdc: 349
                    liveSettlement: true
                    transactionFee: 0.70%
                    endpoint: https://api.hilt.so/v1/agent-commerce/plans/growth/activate
                  - name: Scale
                    monthlyUsd: 1250
                    prepaidUsdc: 1250
                    liveSettlement: true
                    transactionFee: 0.45%
                    endpoint: https://api.hilt.so/v1/agent-commerce/plans/scale/activate
                  - name: Enterprise
                    monthlyUsd: null
                    liveSettlement: true
                    transactionFee: Custom
                  solanaUsdcPrepaidActivation:
                    status: live
                    marketplaceEndpoints:
                      starter: https://api.hilt.so/v1/agent-commerce/plans/starter/activate
                      growth: https://api.hilt.so/v1/agent-commerce/plans/growth/activate
                      scale: https://api.hilt.so/v1/agent-commerce/plans/scale/activate
                    hostedCheckoutEndpoint: https://api.hilt.so/v1/access/billing/checkout/solana-usdc
                    acquisitionRoute: Create a free Agent Bootstrap setup intent before purchasing a live plan.
                    accessPeriodDays: 30
                    automaticRenewal: false
                    renewal: Create and pay a new purchase intent before the current access period ends.
                  deliverable: Payment sessions, Solana USDC settlement, x402 requirements, receipts, entitlements, signed webhooks, subscription state, support context, and audit history through code.
                pricingPolicy:
                  freeAcquisitionPath: Hilt Pay Agent Bootstrap sandbox setup intent
                  liveApiPlans: Agent-native x402 V2 activation paid in Solana USDC, or Hilt account billing for Starter, Growth, and Scale.
                  solanaUsdcPrepaidActivation:
                    marketplaceEndpoints:
                      starter: https://api.hilt.so/v1/agent-commerce/plans/starter/activate
                      growth: https://api.hilt.so/v1/agent-commerce/plans/growth/activate
                      scale: https://api.hilt.so/v1/agent-commerce/plans/scale/activate
                    hostedCheckoutEndpoint: https://api.hilt.so/v1/access/billing/checkout/solana-usdc
                    accessPeriodDays: 30
                    automaticRenewal: false
                    prices:
                      starter: 79 USDC
                      growth: 349 USDC
                      scale: 1,250 USDC
                  rails:
                  - Solana USDC for prepaid API plans
                  - Solana USDC hosted checkout for Hilt account owners
                  protocols:
                  - x402 V2 for HTTP 402 protected-resource payment requirements
                upgradePath:
                - free Hilt Pay Agent Bootstrap sandbox setup
                - agent-native x402 V2 plan activation paid in Solana USDC, or Hilt account billing
                - Hilt Pay API Starter, Growth, Scale, or Enterprise with live key delivery
