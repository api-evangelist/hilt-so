problem_types:
- code: payment_failed
  http: 4xx
  title: Payment did not complete successfully
  remediation: Treat as terminal; show a fresh payment path
  retryable: false
- code: subscription_expired
  title: Paid-through period has ended
  remediation: Stop serving the resource; create a new session
- code: invalid_authorization
  http: 401
  title: Missing or invalid API key or scope
  remediation: Verify the correct auth surface and key scope
- code: webhook_signature_failed
  title: Webhook payload verification failed
  remediation: Validate the raw body against X-Hilt-Signature
- code: invalid_idempotency_key
  title: Idempotency key rejected (SDK registry umbrella)
- code: idempotency_key_required
  title: Idempotency-Key header missing on a write that requires it
- code: idempotency_key_too_long
  title: Idempotency-Key exceeds 255 characters
- code: idempotency_key_invalid
  title: Idempotency-Key contains whitespace or control characters
- code: idempotency_in_progress
  title: Same key still processing
  remediation: Wait and re-read; do not send a second body
  retryable: true
- code: idempotency_conflict
  http: 409
  title: Same key, different body
  remediation: Use a new key for a genuinely different request
- code: idempotency_race
  title: Concurrent race on the same key
  retryable: true
- code: rate_limited
  http: 429
  title: Too many requests
  remediation: Honor Retry-After
  retryable: true
- code: setup_not_ready
  title: Configuration incomplete
  remediation: Call GET /v1/access/setup/readiness before retrying
- code: entitlement_missing
  title: No active entitlement
  remediation: Return 402 to the buyer and create a payment session
- code: subscription_cancelled
  title: Authorization cancelled
  remediation: Stop future collection attempts
- code: subscription_requires_reapproval
  title: Needs buyer reapproval
  remediation: Ask the buyer to complete the reapproval path
- code: request_timeout
  title: SDK timed out before a response
  remediation: Retry reads with backoff; check state before retrying writes
  retryable: true
retry_guidance:
  safe:
  - reads
  - lookups
  - app-side automation after state checks
  unsafe:
  - starting a second payment before the first clearly fails
  - mutating access without checking the payment/membership trail
