aid: hilt-so
name: Hilt
description: 'Hilt is a zero-custody Solana payments company operated in the United Kingdom by Paul Wild trading
  as Hilt (London). It ships four connected products: PayMe (a free receiving link and QR for an OAuth-verified
  X handle, sender pays a flat 2% fee), Direct Checkout (a no-account SOL / USDC / single-token checkout link),
  Hilt Pay Workspace (the merchant dashboard for hosted checkout, embeds, WooCommerce, receipts, memberships, native
  Solana USDC subscriptions and signed webhooks) and Hilt Pay API, the developer and agent product under /v1/access
  that turns an HTTP 402 into an operating record: x402 V2 payment requirement, Solana USDC or native SOL settlement,
  receipt, entitlement, atomic metered usage consumption, MPP payment channels and webhook trail. Hilt publishes
  an OpenAPI 3.1 contract (165 operations on api.hilt.so), a hosted MCP gateway and an OAuth-gated PayMe MCP connector,
  an A2A agent card, llms.txt on three hosts, TypeScript and Python SDKs, a CLI, Postman assets and a documented
  sandbox. Live pricing is $0/month plus 1% per successful settlement.'
image: https://www.hilt.so/Logo.png
url: https://raw.githubusercontent.com/api-evangelist/hilt-so/refs/heads/main/apis.yml
