- aid: hilt-so:hilt-pay-api
  name: Hilt API (Pay API + Workspace)
  description: 'The Hilt REST contract: Hilt Pay API /v1/access routes (agent bootstrap, apps, products, x402 V2
    payment sessions and settlement, durable and metered entitlements, MPP metered payment channels, native Solana
    USDC subscriptions, sandbox sessions, webhooks), Workspace merchant routes (products, hosted checkout, payments,
    memberships, receipts, support, webhooks, API keys, testing scenarios), PayMe routes and the agent-commerce
    offer/catalog/pricing and plan-activation routes. OpenAPI 3.1.0, 154 paths / 165 operations, FastAPI-generated;
    declares no securitySchemes (auth documented in prose: X-Hilt-Key hk_live_/hk_sandbox_, dashboard bearer, PayMe
    OAuth PKCE, x402 PAYMENT-SIGNATURE, MPP Authorization: Payment).'
