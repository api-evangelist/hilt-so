- aid: hilt-so:transaction-evidence
  name: Hilt Solana Transaction Evidence API
  description: 'A public pay-per-request x402 V2 resource on www.hilt.so (0.05 USDC per request, Solana USDC): POST
    /v1/solana/transaction-evidence returns signers, invoked programs, SOL and token balance changes, parsed transfers,
    finality, fee and timestamp for one finalized Solana mainnet transaction. Its own OpenAPI 3.1.0 declares the
    PAYMENT-REQUIRED 402 header and PAYMENT-RESPONSE 200 header plus x-payment-info. Announced 27 August 2026 as
    one of two live payment paths for wallet-capable agents.'
  image: https://www.hilt.so/Logo.png
  humanURL: https://docs.hilt.so/developers/transaction-evidence
  baseURL: https://www.hilt.so
  tags:
