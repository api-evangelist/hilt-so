- aid: hilt-so:payme-mcp
  name: Hilt PayMe MCP Connector
  description: >-
    OAuth-gated remote MCP resource at https://api.hilt.so/mcp/pay-me for compatible AI clients: resolve
    a verified PayMe handle, start a wallet-approved SOL or Solana USDC payment (the client prepares terms;
    the payer signs in their own wallet), read activity, and create/cancel payment links. Authorization
    is OAuth authorization-code with PKCE S256 and dynamic client registration on the issuer https://api.hilt.so
    (RFC 8414 + RFC 9728 metadata published), scopes pay_me:read, pay_me:request, pay_me:prepare. Anonymous
    tools/list answers 401 with a resource_metadata challenge; the ten tool names come from the docs.
  image: https://www.hilt.so/Logo.png
  humanURL: https://docs.hilt.so/developers/pay-me-mcp
  baseURL: https://api.hilt.so/mcp/pay-me
  tags:
  - MCP
  - Authentication
  - Solana
  - USDC
  - Payments
  - PayMe
  tags_raw:
  - MCP
  - OAuth
  - Solana
  - USDC
  - Payments
  - PayMe
