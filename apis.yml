- aid: hilt-so:agent-gateway
  name: Hilt Pay Agent Gateway (MCP + A2A)
  description: 'Hosted MCP server at https://api.hilt.so/mcp (streamable HTTP, protocol 2025-06-18, server Hilt
    Pay Agent Gateway 1.1.0) exposing nine tools: free offer/catalog/pricing/quote/sandbox-bootstrap tools and x402-paid
    Starter/Growth/Scale plan activation plus API-key claim, each with a real JSON Schema inputSchema (tools/list
    answers anonymously). The same gateway publishes an A2A 0.3.0 agent card at /.well-known/agent-card.json (four
    skills) with a JSON-RPC endpoint at /a2a/jsonrpc and a second Agentverse transport at /agentverse/a2a. Listed
    on Glama and Smithery.'
  image: https://www.hilt.so/Logo.png
  humanURL: https://docs.hilt.so/developers/agent-setup
